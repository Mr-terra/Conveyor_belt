name: Release

# Creates a GitHub Release with generated notes when a version tag is pushed,
# for example: git tag v1.0.0 && git push perso v1.0.0
#
# The firmware binary is not attached: it contains the Wi-Fi and Dolibarr secrets
# from the build environment, so it must not be published. Build it from source.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
