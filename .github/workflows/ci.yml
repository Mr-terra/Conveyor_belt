name: CI

on: [push, pull_request]

env:
  BUILD_TYPE: Release

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Configure CMake for tests
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTS=ON -DBUILD_FIRMWARE=OFF

    - name: Build tests
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  firmware:
    name: Firmware Build
    runs-on: ubuntu-latest
    needs: test  # Attend que les tests passent

    steps:
    - uses: actions/checkout@v2

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Configure CMake for firmware
      run: cmake -S . -B build-firmware -DCMAKE_BUILD_TYPE=Release -DBUILD_FIRMWARE=ON -DBUILD_TESTS=OFF

    - name: Build firmware
      run: cmake --build build-firmware

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v2
      with:
        name: firmware
        path: build-firmware/t-iot-911.bin