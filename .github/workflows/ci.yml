name: CI

on:
  push:
    branches: [main]

env:
  BUILD_TYPE: Release

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Configure CMake for tests
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTS=ON -DBUILD_FIRMWARE=OFF

    - name: Build tests
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  firmware:
    name: Firmware Build (PlatformIO)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PlatformIO
      run: pip install platformio

    - name: Create .env from repository secrets
      env:
        DOLIBARR_URL: ${{ secrets.DOLIBARR_URL }}
        DOLIBARR_API_KEY: ${{ secrets.DOLIBARR_API_KEY }}
        WIFI_SSID: ${{ secrets.WIFI_SSID }}
        WIFI_PASS: ${{ secrets.WIFI_PASS }}
      run: |
        {
          echo "DOLIBARR_URL=$DOLIBARR_URL"
          echo "DOLIBARR_API_KEY=$DOLIBARR_API_KEY"
          echo "WIFI_SSID=$WIFI_SSID"
          echo "WIFI_PASS=$WIFI_PASS"
        } > .env

    - name: Build firmware
      run: pio run -e m5stack-grey

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: .pio/build/m5stack-grey/firmware.bin
