name: CI

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # cmake and the GCC toolchain are preinstalled on the ubuntu-latest runner
    - name: Configure CMake for tests
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTS=ON

    - name: Build tests
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  firmware:
    name: Firmware Build (PlatformIO)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # Platform and library downloads are the slow part of the build
    - uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: platformio-${{ hashFiles('platformio.ini') }}

    - name: Install PlatformIO
      run: pip install platformio

    - name: Build firmware
      run: pio run -e m5stack-grey

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: .pio/build/m5stack-grey/firmware.bin
