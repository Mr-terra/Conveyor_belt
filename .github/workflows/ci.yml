name: CI

on: [push, pull_request]

env:
  BUILD_TYPE: Release

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential

    - name: Configure CMake for tests
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DBUILD_TESTS=ON -DBUILD_FIRMWARE=OFF

    - name: Build tests
      run: cmake --build build --config ${{ env.BUILD_TYPE }}

    - name: Run tests
      run: ctest --test-dir build --output-on-failure

  firmware:
    name: Firmware Build with CMake
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential git python3 python3-pip wget tar

    - name: Install Arduino ESP32 framework
      run: |
        mkdir -p ~/Arduino/hardware/espressif
        cd ~/Arduino/hardware/espressif

        # Download the latest stable version
        # First, find the correct URL
        LATEST_URL=$(curl -s https://api.github.com/repos/espressif/arduino-esp32/releases/latest | \
                    grep "browser_download_url.*tar.gz" | \
                    cut -d '"' -f 4)
        wget $LATEST_URL -O arduino-esp32.tar.gz
        tar -xzf arduino-esp32.tar.gz
        rm arduino-esp32.tar.gz
        mv arduino-esp32* esp32

    - name: Configure CMake
      run: |
        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_FIRMWARE=ON \
          -DBUILD_TESTS=OFF \
          -DARDUINO_PATH=$HOME/Arduino \
          -DM5STACK_PATH=${{ github.workspace }}/lib/M5Stack_lib \
          -DGRBL_PATH=${{ github.workspace }}/lib/Module_GRBL_13.2 \
          -DMFRC522_PATH=${{ github.workspace }}/lib/MFRC522_I2C \
          -DARDUINOJSON_PATH=${{ github.workspace }}/lib/ArduinoJson

    - name: Build firmware
      run: cmake --build build --config Release

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware
        path: build/firmware.bin