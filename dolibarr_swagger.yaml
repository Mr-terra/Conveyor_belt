openapi: 3.0.3
info:
  title: API Gestion Produits & Stocks
  description: Swagger documentation of the API, authenticated with DOLAPIKEY
  version: 1.0.0

servers:
  - url: http://localhost/api/index.php

components:
  securitySchemes:
    DolApiKeyAuth:
      type: apiKey
      in: header
      name: DOLAPIKEY

security:
  - DolApiKeyAuth: []

paths:
  /users/info:
    get:
      summary: Get the current user's information
      tags:
        - Users
      responses:
        "200":
          description: User information retrieved successfully

  /warehouses/{id}:
    get:
      summary: Get a warehouse by ID
      tags:
        - Warehouses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Warehouse found
        "404":
          description: Warehouse not found

  /products:
    get:
      summary: Search products with SQL filters
      tags:
        - Products
      parameters:
        - name: sqlfilters
          in: query
          required: false
          schema:
            type: string
          example: "(barcode:=:'041D19DA700000')"
      responses:
        "200":
          description: List of products

    post:
      summary: Create a product
      tags:
        - Products
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ref
                - barcode
                - label
                - type
                - price
                - price_base_type
                - status
              properties:
                ref:
                  type: string
                  example: PROD_RFID_03
                barcode:
                  type: string
                  example: "041D19DA700000"
                label:
                  type: string
                  example: Colis C
                type:
                  type: integer
                  example: 0
                price:
                  type: number
                  example: 0
                price_base_type:
                  type: string
                  example: HT
                status:
                  type: integer
                  example: 1
                array_options:
                  type: object
                  properties:
                    options_default_target_warehouse_id:
                      type: string
                      example: "3"
      responses:
        "201":
          description: Product created successfully

  /products/{id}/stock:
    get:
      summary: Get the stock of a product
      tags:
        - Products
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product stock

  /stockmovements:
    post:
      summary: Create a stock movement
      tags:
        - Stock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - product_id
                - warehouse_id
                - qty
              properties:
                product_id:
                  type: integer
                  example: 10
                warehouse_id:
                  type: integer
                  example: 3
                qty:
                  type: number
                  example: 1
      responses:
        "201":
          description: Stock movement created

  /warehouses:
    post:
      summary: Create a warehouse
      tags:
        - Warehouses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - label
              properties:
                label:
                  type: string
                  example: Warehouse A
      responses:
        "201":
          description: Warehouse created
