[env:m5stack-grey]
; Pinned: the M5Stack 0.4.6 library needs the Arduino-ESP32 2.x core (6.12.0 ships 2.0.17).
; Newer platform releases ship a 3.x core that no longer builds it.
platform = espressif32@6.12.0
board = m5stack-grey
framework = arduino
lib_deps = 
	m5stack/Module_GRBL_13.2@^0.0.3
	m5stack/M5Stack@^0.4.6
  	kkloesener/MFRC522_I2C
	bblanchon/ArduinoJson
  
monitor_speed = 115200

extra_scripts = pre:env_script.py